<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Review Platform</title>
    <link rel="stylesheet" href="../static/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single+Ink:wght@100..900&family=Cause:wght@100..900&family=Chewy&family=Comic+Relief:wght@400;700&family=Delicious+Handrawn&family=Grandstander:ital,wght@0,100..900;1,100..900&family=Jersey+10&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Rampart+One&family=Roboto:ital,wght@0,100..900;1,100..900&family=Sniglet:wght@400;800&family=Space+Mono&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar" id="navBlock">
      <div class="nav-container">
        <div class="nav-logo">
          <h1>Course Review Platform</h1>
        </div>
        <div class="nav-menu">
          <div class="search_img">
            <img src="../static/icons/search2.png" class="search-icon">
            <input
              type="text"
              placeholder="Search courses..."
              class="search-box"
              id="searchBox"
            />
          </div>
          <div class="user-menu" id="userMenu" style="display: none">
            <button class="user-avatar" id="userAvatar" type="button" aria-label="Account menu"></button>
            <div class="user-dropdown" id="userDropdown" hidden>
              <button type="button" id="profileMenuBtn">Profile</button>
              <button type="button" id="favoritesMenuBtn">Favorite</button>
              <button type="button" id="signOutMenuBtn">Sign out</button>
            </div>
          </div>
          <button class="btn-logout" id="logoutBtn" style="display: none">
            Logout
          </button>
          <button class="btn-login" id="loginBtn" type="button">Login / Sign in</button>
        </div>
      </div>
    </nav>

<!-- Login Modal -->
    <div id="loginModal" class="modal login-page-overlay" style="display: block">
      
      <div id="welcomeStartSection" class="welcome-pure-text">
        <div class="welcome-header">
          <h1>Course Review Platform</h1>
          <p class="welcome-subtitle">A platform that allows students to leave course reviews.</p>
        </div>
        <button type="button" class="btn-submit" id="startExploreBtn" onclick="showAuthFields()">Start</button>
      </div>

      <div id="authCoreSection" class="welcome-white-box" style="display: none;">
        <div class="auth-tabs">
          <button type="button" id="tabLogin" class="tab-btn active" onclick="switchAuthTab('login')">Login</button>
          <button type="button" id="tabRegister" class="tab-btn" onclick="switchAuthTab('register')">Register</button>
        </div>

        <form id="authForm">
          <div class="register-fields" id="registerFields" style="display: none">
            <div class="avatar-preview" id="avatarPreview" aria-hidden="true"></div>
            <div class="form-group">
              <label for="avatarAnimal">Avatar</label>
              <select id="avatarAnimal">
                <option value="question">Default</option>
                <option value="cat">Cat</option>
                <option value="dog">Dog</option>
                <option value="bear">Bear</option>
                <option value="monkey">Monkey</option>
                <option value="elephant">Elephant</option>
              </select>
            </div>
            <div class="form-group">
              <label for="gender">Gender</label>
              <select id="gender">
                <option value="undisclosed">Prefer not to say</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>
          </div>

          <div class="input-groups">
            <input type="text" placeholder="Username" id="username" required />
            <input
              type="email"
              placeholder="Email"
              id="email"
              class="register-only"
              style="display: none"
            />
            <input
              type="password"
              placeholder="Password"
              id="password"
              required
            />
            <input
              type="password"
              placeholder="Confirm Password"
              id="confirmPassword"
              class="register-only"
              style="display: none"
            />
          </div>

          <button type="submit" class="btn-submit" id="authSubmitBtn">Login</button>
        </form>
      </div>
      
    </div>


    <!-- Main Content -->
    <main class="main-content" id="mainContentBlock">
      <section class="page-heading" id="pageHeading">
        <div>

        </div>
      </section>

      <!-- Filters -->
      <div class="filters">
        <div class="filter-group">
          <select id="yearFilter" class="filter-select">
            <option value="">All Years</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
          </select>
        </div>

        <div class="filter-group">
          <select id="departmentFilter" class="filter-select">
            <option value="">All Departments</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Mathematics">Mathematics</option>
            <option value="English">English</option>
            <option value="Physics">Physics</option>
          </select>
        </div>

        <div class="filter-group">
          <select id="ratingFilter" class="filter-select">
            <option value="">All Ratings</option>
            <option value="5">5 Stars</option>
            <option value="4">4+ Stars</option>
            <option value="3">3+ Stars</option>
            <option value="1">1+ Stars</option>
          </select>
        </div>

        <div class="filter-group">
          <select id="sortFilter" class="filter-select">
            <option value="default">Default Order</option>
            <option value="ratingDesc">Rating: High to Low</option>
            <option value="ratingAsc">Rating: Low to High</option>
            <option value="reviewsDesc">Reviews: Most to Fewest</option>
            <option value="reviewsAsc">Reviews: Fewest to Most</option>
          </select>
        </div>
      </div>

      <!-- Courses Grid -->
      <div class="courses-container" id="coursesContainer">
        <!-- Courses will be loaded here by JavaScript -->
      </div>

      <section id="favoritesPage" class="favorites-page" style="display: none">
        <div class="section-heading">
          <div>
            <p class="page-kicker">Saved Courses</p>
            <h2>My Favorites</h2>
          </div>
          <button class="btn-secondary" type="button" onclick="showBrowseCourses()">
            Back to Browse
          </button>
        </div>
        <div class="filters favorites-filters">
          <div class="filter-group">
            <select id="favoriteDepartmentFilter" class="filter-select">
              <option value="">All Departments</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Mathematics">Mathematics</option>
              <option value="English">English</option>
              <option value="Physics">Physics</option>
            </select>
          </div>
          <div class="filter-group">
            <select id="favoriteRatingFilter" class="filter-select">
              <option value="">All Ratings</option>
              <option value="5">5 Stars</option>
              <option value="4">4+ Stars</option>
              <option value="3">3+ Stars</option>
              <option value="1">1+ Stars</option>
            </select>
          </div>
          <div class="filter-group">
            <select id="favoriteSortFilter" class="filter-select">
              <option value="default">Default Order</option>
              <option value="ratingDesc">Rating: High to Low</option>
              <option value="ratingAsc">Rating: Low to High</option>
              <option value="reviewsDesc">Reviews: Most to Fewest</option>
              <option value="reviewsAsc">Reviews: Fewest to Most</option>
            </select>
          </div>
        </div>
        <div class="courses-container" id="favoritesContainer"></div>
      </section>

      <!-- Course Detail Page -->
      <section id="courseDetailPage" class="course-detail-page" style="display: none">
        <button class="back-button" onclick="closeCourseDetail()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 12H5"></path>
            <path d="m12 19-7-7 7-7"></path>
          </svg>
          Back to Courses
        </button>

        <div class="course-detail-layout">
          <article class="detail-card course-overview-card">
            <div class="detail-course-tags">
              <span class="detail-course-code" id="detailCourseCode"></span>
              <span class="detail-course-term" id="detailCourseTerm"></span>
            </div>
            <h2 id="detailCourseTitle"></h2>
            <p class="detail-course-title-zh" id="detailCourseTitleZh"></p>

            <div class="detail-meta-grid">
              <div>
                <span>Professor</span>
                <strong id="detailCourseProfessor"></strong>
              </div>
              <div>
                <span>Department</span>
                <strong id="detailCourseDepartment"></strong>
              </div>
              <div>
                <span>Credits</span>
                <strong id="detailCourseCredits"></strong>
              </div>
            </div>

            <div class="detail-description">
              <span>Description</span>
              <p id="detailCourseDescription"></p>
            </div>
            <div class="detail-tag-list" id="detailTagList"></div>
            <div class="detail-social-row">
              <div class="detail-social-stats" id="detailCourseSocialStats"></div>
              <button
                class="course-follow-btn detail-follow-btn"
                id="detailFollowBtn"
                type="button"
                aria-label="Save course"
                title="Save course"
              ></button>
            </div>
          </article>

          <aside class="detail-card rating-summary-card">
            <h3>Course Rating</h3>
            <div class="rating-summary-main">
              <div class="rating-score" id="detailRatingValue"></div>
              <div class="stars rating-summary-stars" id="detailStars"></div>
            </div>
            <p class="rating-summary-count" id="detailReviewCount"></p>
            <div class="rating-breakdown" id="ratingBreakdown"></div>
          </aside>
        </div>

        <section class="student-reviews-section">
          <div class="student-reviews-header">
            <h2>Student Reviews</h2>
            <button class="btn-add-review" onclick="openReviewForm()">
              Write a Review
            </button>
          </div>
          <form
            id="reviewForm"
            class="inline-review-form"
            onsubmit="submitReview(event)"
            style="display: none"
          >
            <div class="form-group">
              <label for="rating">Rating:</label>
              <div class="star-rating" onmouseleave="updateStarDisplay()">
                <button type="button" class="star" onclick="setRating(1)" onmouseenter="previewRating(1)" onfocus="previewRating(1)" aria-label="1 star">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9L12 2.8z" />
                  </svg>
                </button>
                <button type="button" class="star" onclick="setRating(2)" onmouseenter="previewRating(2)" onfocus="previewRating(2)" aria-label="2 stars">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9L12 2.8z" />
                  </svg>
                </button>
                <button type="button" class="star" onclick="setRating(3)" onmouseenter="previewRating(3)" onfocus="previewRating(3)" aria-label="3 stars">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9L12 2.8z" />
                  </svg>
                </button>
                <button type="button" class="star" onclick="setRating(4)" onmouseenter="previewRating(4)" onfocus="previewRating(4)" aria-label="4 stars">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9L12 2.8z" />
                  </svg>
                </button>
                <button type="button" class="star" onclick="setRating(5)" onmouseenter="previewRating(5)" onfocus="previewRating(5)" aria-label="5 stars">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9L12 2.8z" />
                  </svg>
                </button>
              </div>
              <input type="hidden" id="ratingInput" value="0" />
            </div>

            <div class="form-group">
              <label for="reviewText">Review:</label>
              <textarea
                id="reviewText"
                placeholder="Write your review..."
                required
              ></textarea>
            </div>

            <div class="inline-review-actions">
              <button type="button" class="btn-secondary" onclick="closeReviewModal()">
                Cancel
              </button>
              <button type="submit" class="btn-submit">Submit Review</button>
            </div>
          </form>
          <div class="reviews-list" id="reviewsList">
            <!-- Reviews will be loaded here -->
          </div>
        </section>
      </section>
    </main>

    <script src="../static/script.js"></script>
  </body>
</html>
